aid: tesorio
name: Tesorio
description: >-
  Tesorio is an AI-powered financial operations platform that automates accounts
  receivable, accelerates cash flow, and gives finance teams intelligent tools to
  manage collections, forecasting, and payment workflows. It connects to ERP, CRM,
  and payment systems (NetSuite, Sage Intacct, Workday, Zuora, Salesforce, Stripe
  and more), matches incoming payments to open invoices, drafts AI follow-up
  emails, extracts payment promises, and predicts pay dates so treasury, AR, and
  FP&A teams can reduce days sales outstanding. Tesorio exposes a hosted Model
  Context Protocol (MCP) server so AI tools like Claude, ChatGPT, and Cursor can
  query live Tesorio data. Founded via Y Combinator.
